<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LocalShare — Personal File Network</title>
  <style>
    :root {
      --bg-primary: #0f141c;
      --bg-secondary: rgba(26, 34, 48, 0.75);
      --bg-card: rgba(30, 41, 59, 0.65);
      --bg-card-hover: rgba(45, 59, 82, 0.85);
      --border-color: rgba(255, 255, 255, 0.1);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --accent-light: rgba(56, 189, 248, 0.15);
      --danger: #ef4444;
      --success: #10b981;
      --glass-blur: blur(16px);
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      --radius: 12px;
    }
    [data-theme="light"] {
      --bg-primary: #f1f5f9;
      --bg-secondary: rgba(255, 255, 255, 0.85);
      --bg-card: rgba(255, 255, 255, 0.9);
      --bg-card-hover: #ffffff;
      --border-color: rgba(0, 0, 0, 0.08);
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --accent-light: rgba(2, 132, 199, 0.12);
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s, color 0.2s;
    }
    .app-window {
      max-width: 1200px;
      width: 95%;
      margin: 24px auto 40px auto;
      background: var(--bg-secondary);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex: 1;
    }
    .window-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: rgba(0, 0, 0, 0.06);
      border-bottom: 1px solid var(--border-color);
      user-select: none;
    }
    .traffic-lights {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .light {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .light-close { background: #ff5f56; }
    .light-min { background: #ffbd2e; }
    .light-max { background: #27c93f; }
    .window-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .window-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn-icon {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .btn-icon:hover {
      background: var(--accent-light);
      border-color: var(--accent);
      color: var(--accent);
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border-color);
      background: rgba(255, 255, 255, 0.02);
    }
    .breadcrumbs {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      font-weight: 500;
    }
    .breadcrumb-item {
      color: var(--text-secondary);
      cursor: pointer;
      text-decoration: none;
    }
    .breadcrumb-item:hover { color: var(--accent); }
    .breadcrumb-item.active {
      color: var(--text-primary);
      font-weight: 600;
      cursor: default;
    }
    .search-box {
      position: relative;
      flex: 1;
      max-width: 280px;
    }
    .search-box input {
      width: 100%;
      padding: 8px 12px 8px 34px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-box input:focus { border-color: var(--accent); }
    .search-box svg {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      fill: var(--text-secondary);
    }
    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn {
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      border: 1px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
      text-decoration: none;
    }
    .btn-primary {
      background: var(--accent);
      color: #ffffff;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary {
      background: var(--bg-card);
      border-color: var(--border-color);
      color: var(--text-primary);
    }
    .btn-secondary:hover {
      background: var(--bg-card-hover);
      border-color: var(--accent);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .content-area {
      padding: 24px 20px;
      flex: 1;
      overflow-y: auto;
    }
    .file-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
    }
    .file-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      position: relative;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
    }
    .file-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.15);
    }
    .file-card.selected {
      border-color: var(--accent);
      background: var(--accent-light);
    }
    .select-checkbox {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .card-icon {
      width: 56px;
      height: 56px;
      margin: 10px 0 12px 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .file-card-name {
      font-size: 0.9rem;
      font-weight: 500;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 6px;
      width: 100%;
    }
    .file-card-meta {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }
    .card-actions {
      display: flex;
      gap: 6px;
      width: 100%;
      margin-top: auto;
    }
    .card-actions .btn {
      flex: 1;
      justify-content: center;
      padding: 6px;
      font-size: 0.75rem;
    }
    .file-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    .file-table th {
      text-align: left;
      padding: 10px 14px;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border-color);
      font-weight: 600;
    }
    .file-table td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-color);
      vertical-align: middle;
    }
    .file-table tr {
      cursor: pointer;
      transition: background 0.15s;
    }
    .file-table tr:hover { background: var(--bg-card-hover); }
    .file-table tr.selected { background: var(--accent-light); }
    .list-icon-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .list-icon { width: 24px; height: 24px; flex-shrink: 0; }
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      color: var(--text-secondary);
      text-align: center;
    }
    .empty-state svg { width: 64px; height: 64px; margin-bottom: 16px; opacity: 0.6; }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-window {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      max-width: 900px;
      width: 100%;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: modalSlide 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes modalSlide {
      from { transform: scale(0.94); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border-color);
    }
    .modal-body {
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 250px;
      background: rgba(0, 0, 0, 0.15);
    }
    .preview-media {
      max-width: 100%;
      max-height: 60vh;
      border-radius: 8px;
    }
    .code-preview {
      width: 100%;
      background: #090d16;
      color: #e2e8f0;
      padding: 16px;
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
      white-space: pre-wrap;
      overflow-x: auto;
      max-height: 55vh;
    }
    .dropzone {
      border: 2px dashed var(--accent);
      background: var(--accent-light);
      border-radius: var(--radius);
      padding: 36px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
    }
    .dropzone:hover, .dropzone.dragover {
      background: rgba(56, 189, 248, 0.25);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 600;
    }
    .badge-success { background: rgba(16, 185, 129, 0.2); color: var(--success); }
    .badge-accent { background: var(--accent-light); color: var(--accent); }
    .badge-warning { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
    @media (max-width: 640px) {
      .app-window { margin: 8px auto; width: 100%; border-radius: 0; border: none; }
      .search-box { max-width: 100%; order: 3; }
      .toolbar { gap: 8px; }
      .file-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    }
  </style>
</head>
<body>
  <div class="app-window">
    <header class="window-header">
      <div class="traffic-lights">
        <div class="light light-close"></div>
        <div class="light light-min"></div>
        <div class="light light-max"></div>
      </div>
      <div class="window-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"></path>
          <path d="M12 11v6"></path>
          <path d="m9 14 3-3 3 3"></path>
        </svg>
        <span>LocalShare Network Browser</span>
      </div>
      <div class="window-actions">
        <button id="themeToggle" class="btn-icon" title="Toggle Theme">
          <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
          </svg>
        </button>
      </div>
    </header>

    <div class="toolbar">
      <div class="breadcrumbs" id="breadcrumbs">
        <span class="breadcrumb-item active" onclick="loadShares()">All Shares</span>
      </div>

      <div class="search-box">
        <svg viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke="currentColor" stroke-width="2" fill="none"/></svg>
        <input type="text" id="searchInput" placeholder="Search shared items..." oninput="handleSearch()">
      </div>

      <div class="toolbar-actions" id="toolbarActions">
        <div style="display:flex; gap:4px;">
          <button id="viewGridBtn" class="btn-icon" title="Grid View" onclick="setViewMode('grid')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
          </button>
          <button id="viewListBtn" class="btn-icon" title="List View" onclick="setViewMode('list')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          </button>
        </div>
        <button id="selectToggleBtn" class="btn btn-secondary" onclick="toggleSelectAll()" style="display:none;">Select All</button>
        <button id="zipDownloadBtn" class="btn btn-primary" onclick="downloadSelectedZip()" style="display:none;" disabled>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download ZIP
        </button>
        <button id="uploadBtn" class="btn btn-primary" onclick="openUploadModal()" style="display:none;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Upload
        </button>
      </div>
    </div>

    <main class="content-area" id="contentArea">
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        <h3>Connecting to LocalShare...</h3>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="previewModal">
    <div class="modal-window">
      <div class="modal-header">
        <div style="font-weight:600; font-size:0.95rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" id="previewTitle">File Preview</div>
        <div style="display:flex; gap:8px;">
          <a id="previewDownloadDirect" class="btn btn-primary" href="#" download>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Download
          </a>
          <button class="btn btn-secondary" onclick="closeModal('previewModal')">Close</button>
        </div>
      </div>
      <div class="modal-body" id="previewBody"></div>
    </div>
  </div>

  <div class="modal-overlay" id="uploadModal">
    <div class="modal-window" style="max-width: 520px;">
      <div class="modal-header">
        <div style="font-weight:600; font-size:0.95rem;">Upload Files to Share</div>
        <button class="btn btn-secondary" onclick="closeModal('uploadModal')">Close</button>
      </div>
      <div class="modal-body" style="background:transparent; padding:24px;">
        <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom:12px; color:var(--accent);">
            <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"></path>
            <path d="M12 12v9"></path>
            <path d="m8 16 4-4 4 4"></path>
          </svg>
          <div style="font-weight:600; margin-bottom:4px;">Drag & drop files here</div>
          <div style="font-size:0.8rem; color:var(--text-secondary);">or click to browse from this device</div>
          <input type="file" id="fileInput" multiple style="display:none;" onchange="handleFileSelect(this.files)">
        </div>
        <div id="uploadStatus" style="width:100%; margin-top:16px; font-size:0.85rem; display:none;">
          <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
            <span id="uploadStatusText">Uploading...</span>
            <span id="uploadPercent">0%</span>
          </div>
          <div style="width:100%; height:6px; background:var(--border-color); border-radius:3px; overflow:hidden;">
            <div id="uploadProgressBar" style="width:0%; height:100%; background:var(--accent); transition:width 0.2s;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="passwordModal">
    <div class="modal-window" style="max-width: 400px;">
      <div class="modal-header">
        <div style="font-weight:600; font-size:0.95rem;">Protected Share</div>
      </div>
      <div class="modal-body" style="background:transparent; padding:24px; text-align:center;">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom:12px; color:var(--accent);">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <div style="font-size:0.9rem; margin-bottom:16px;">This share requires a password to view files.</div>
        <input type="password" id="sharePasswordInput" placeholder="Enter share password" style="width:100%; padding:10px 14px; border-radius:8px; border:1px solid var(--border-color); background:var(--bg-card); color:var(--text-primary); margin-bottom:14px; outline:none;">
        <div id="passwordError" style="color:var(--danger); font-size:0.8rem; margin-bottom:10px; display:none;">Incorrect password</div>
        <button class="btn btn-primary" style="width:100%; justify-content:center;" onclick="submitPassword()">Unlock Content</button>
      </div>
    </div>
  </div>

  <script>
    let state = {
      shares: [],
      currentShare: null,
      currentFiles: [],
      selectedIds: new Set(),
      viewMode: 'grid',
      searchQuery: '',
      theme: 'dark'
    };

    function initTheme() {
      const saved = localStorage.getItem('localshare_theme') || 'dark';
      state.theme = saved;
      document.documentElement.setAttribute('data-theme', saved);
    }

    document.getElementById('themeToggle').addEventListener('click', () => {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', state.theme);
      localStorage.setItem('localshare_theme', state.theme);
    });

    initTheme();
    window.addEventListener('hashchange', handleRoute);
    window.addEventListener('DOMContentLoaded', () => {
      setupDropzone();
      handleRoute();
    });

    async function handleRoute() {
      const hash = window.location.hash;
      if (hash.startsWith('#/share/')) {
        const shareId = hash.replace('#/share/', '').trim();
        await openShare(shareId);
      } else {
        await loadShares();
      }
    }

    async function loadShares() {
      state.currentShare = null;
      state.selectedIds.clear();
      window.location.hash = '';
      updateBreadcrumbs([]);
      updateToolbar();

      const contentArea = document.getElementById('contentArea');
      contentArea.innerHTML = '<div class="empty-state">Loading shares...</div>';

      try {
        const res = await fetch('/api/shares');
        if (!res.ok) throw new Error('Failed to load shares');
        state.shares = await res.json();
        renderShares();
      } catch (err) {
        contentArea.innerHTML = '<div class="empty-state"><h3>Unable to connect to LocalShare</h3><p style="margin-top:6px; font-size:0.85rem;">Check if the host device server is running and connected to Wi-Fi.</p></div>';
      }
    }

    function renderShares() {
      const contentArea = document.getElementById('contentArea');
      if (state.shares.length === 0) {
        contentArea.innerHTML = '<div class="empty-state"><h3>No public shares configured</h3><p style="margin-top:6px; font-size:0.85rem;">The host has not enabled any shares yet.</p></div>';
        return;
      }

      let html = '<div class="file-grid">';
      for (const share of state.shares) {
        html += '<div class="file-card" onclick="location.hash=\'#/share/' + share.id + '\'">' +
          '<div class="card-icon">' +
            '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.5"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"></path></svg>' +
          '</div>' +
          '<div class="file-card-name" style="font-size:1rem; font-weight:600;">' + escapeHtml(share.name) + '</div>' +
          '<div class="file-card-meta">' + escapeHtml(share.description || 'Public Share') + '</div>' +
          '<div style="display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-bottom:8px;">' +
            (share.allowUploads ? '<span class="badge badge-success">Uploads Allowed</span>' : '<span class="badge badge-accent">Read-only</span>') +
            (share.isPasswordProtected ? ' <span class="badge badge-warning">Password Protected</span>' : '') +
          '</div>' +
        '</div>';
      }
      html += '</div>';
      contentArea.innerHTML = html;
    }

    async function openShare(shareId) {
      const contentArea = document.getElementById('contentArea');
      contentArea.innerHTML = '<div class="empty-state">Loading share items...</div>';

      try {
        const token = sessionStorage.getItem('token_' + shareId) || '';
        const res = await fetch('/api/shares/' + shareId + '/files', {
          headers: token ? { 'Authorization': 'Bearer ' + token } : {}
        });

        if (res.status === 401) {
          showPasswordModal(shareId);
          return;
        }

        if (!res.ok) throw new Error('Failed to load share');

        const data = await res.json();
        state.currentShare = data.share;
        state.currentFiles = data.items || [];
        state.selectedIds.clear();

        updateBreadcrumbs([{ name: state.currentShare.name, action: null }]);
        updateToolbar();
        renderFiles();
      } catch (err) {
        contentArea.innerHTML = '<div class="empty-state"><h3>Error loading share</h3><p>' + err.message + '</p><button class="btn btn-secondary" style="margin-top:12px;" onclick="loadShares()">Back to All Shares</button></div>';
      }
    }

    function renderFiles() {
      const contentArea = document.getElementById('contentArea');
      let files = state.currentFiles;
      if (state.searchQuery) {
        const q = state.searchQuery.toLowerCase();
        files = files.filter(f => f.displayName.toLowerCase().includes(q));
      }

      if (files.length === 0) {
        contentArea.innerHTML = '<div class="empty-state"><h3>No files in this share</h3><p style="margin-top:6px; font-size:0.85rem;">' + (state.currentShare.allowUploads ? 'Drag and drop or click Upload to add files.' : 'This share has no files available.') + '</p></div>';
        return;
      }

      if (state.viewMode === 'grid') {
        renderGridView(files);
      } else {
        renderListView(files);
      }
    }

    function renderGridView(files) {
      const contentArea = document.getElementById('contentArea');
      let html = '<div class="file-grid">';
      for (const f of files) {
        const isSelected = state.selectedIds.has(f.id);
        const iconSvg = getFileIconSvg(f);
        html += '<div class="file-card ' + (isSelected ? 'selected' : '') + '" onclick="toggleItemSelect(\'' + f.id + '\', event)">' +
          '<input type="checkbox" class="select-checkbox" ' + (isSelected ? 'checked' : '') + ' onclick="event.stopPropagation(); toggleItemSelect(\'' + f.id + '\', event)">' +
          '<div class="card-icon" onclick="previewFile(\'' + f.id + '\', event)">' + iconSvg + '</div>' +
          '<div class="file-card-name" title="' + escapeHtml(f.displayName) + '">' + escapeHtml(f.displayName) + '</div>' +
          '<div class="file-card-meta">' + formatBytes(f.sizeBytes) + '</div>' +
          '<div class="card-actions">' +
            '<button class="btn btn-secondary" onclick="event.stopPropagation(); previewFile(\'' + f.id + '\', event)" title="Preview">Preview</button>' +
            '<a class="btn btn-primary" href="/api/shares/' + state.currentShare.id + '/download?id=' + f.id + '" onclick="event.stopPropagation();" download title="Download">Download</a>' +
          '</div>' +
        '</div>';
      }
      html += '</div>';
      contentArea.innerHTML = html;
    }

    function renderListView(files) {
      const contentArea = document.getElementById('contentArea');
      let html = '<table class="file-table"><thead><tr><th style="width: 40px;"></th><th>Name</th><th>Type</th><th>Size</th><th style="text-align: right;">Actions</th></tr></thead><tbody>';
      for (const f of files) {
        const isSelected = state.selectedIds.has(f.id);
        const iconSvg = getFileIconSvg(f, 20);
        html += '<tr class="' + (isSelected ? 'selected' : '') + '" onclick="toggleItemSelect(\'' + f.id + '\', event)">' +
          '<td><input type="checkbox" class="select-checkbox" style="position:static;" ' + (isSelected ? 'checked' : '') + ' onclick="event.stopPropagation(); toggleItemSelect(\'' + f.id + '\', event)"></td>' +
          '<td><div class="list-icon-title">' + iconSvg + '<span style="font-weight:500;">' + escapeHtml(f.displayName) + '</span></div></td>' +
          '<td style="color:var(--text-secondary);">' + getFileTypeLabel(f) + '</td>' +
          '<td style="color:var(--text-secondary);">' + formatBytes(f.sizeBytes) + '</td>' +
          '<td style="text-align: right;">' +
            '<button class="btn btn-secondary" style="padding:4px 8px;" onclick="event.stopPropagation(); previewFile(\'' + f.id + '\', event)">Preview</button>' +
            '<a class="btn btn-primary" style="padding:4px 8px; margin-left:6px;" href="/api/shares/' + state.currentShare.id + '/download?id=' + f.id + '" onclick="event.stopPropagation();" download>Download</a>' +
          '</td>' +
        '</tr>';
      }
      html += '</tbody></table>';
      contentArea.innerHTML = html;
    }

    function toggleItemSelect(id, e) {
      if (state.selectedIds.has(id)) {
        state.selectedIds.delete(id);
      } else {
        state.selectedIds.add(id);
      }
      updateToolbar();
      renderFiles();
    }

    function toggleSelectAll() {
      if (state.selectedIds.size === state.currentFiles.length) {
        state.selectedIds.clear();
      } else {
        state.currentFiles.forEach(f => state.selectedIds.add(f.id));
      }
      updateToolbar();
      renderFiles();
    }

    function updateToolbar() {
      const selectToggleBtn = document.getElementById('selectToggleBtn');
      const zipDownloadBtn = document.getElementById('zipDownloadBtn');
      const uploadBtn = document.getElementById('uploadBtn');

      if (state.currentShare) {
        selectToggleBtn.style.display = 'inline-flex';
        zipDownloadBtn.style.display = 'inline-flex';
        selectToggleBtn.innerText = state.selectedIds.size === state.currentFiles.length && state.currentFiles.length > 0 ? 'Clear Selection' : 'Select All';
        zipDownloadBtn.disabled = state.selectedIds.size === 0;
        zipDownloadBtn.innerText = 'Download ZIP (' + state.selectedIds.size + ')';
        uploadBtn.style.display = state.currentShare.allowUploads ? 'inline-flex' : 'none';
      } else {
        selectToggleBtn.style.display = 'none';
        zipDownloadBtn.style.display = 'none';
        uploadBtn.style.display = 'none';
      }
    }

    function updateBreadcrumbs(crumbs) {
      const container = document.getElementById('breadcrumbs');
      let html = '<span class="breadcrumb-item ' + (crumbs.length === 0 ? 'active' : '') + '" onclick="loadShares()">All Shares</span>';
      for (let i = 0; i < crumbs.length; i++) {
        const c = crumbs[i];
        const isLast = i === crumbs.length - 1;
        html += ' <span style="color:var(--text-secondary);">/</span> ';
        html += '<span class="breadcrumb-item ' + (isLast ? 'active' : '') + '">' + escapeHtml(c.name) + '</span>';
      }
      container.innerHTML = html;
    }

    function setViewMode(mode) {
      state.viewMode = mode;
      document.getElementById('viewGridBtn').style.borderColor = mode === 'grid' ? 'var(--accent)' : 'var(--border-color)';
      document.getElementById('viewListBtn').style.borderColor = mode === 'list' ? 'var(--accent)' : 'var(--border-color)';
      if (state.currentShare) renderFiles();
    }

    function handleSearch() {
      state.searchQuery = document.getElementById('searchInput').value;
      if (state.currentShare) renderFiles();
    }

    function downloadSelectedZip() {
      if (state.selectedIds.size === 0 || !state.currentShare) return;
      const ids = Array.from(state.selectedIds).join(',');
      const url = '/api/shares/' + state.currentShare.id + '/download-zip?files=' + encodeURIComponent(ids);
      window.location.href = url;
    }

    async function previewFile(id, e) {
      if (e) e.stopPropagation();
      const file = state.currentFiles.find(f => f.id === id);
      if (!file) return;

      document.getElementById('previewTitle').innerText = file.displayName;
      const downloadLink = '/api/shares/' + state.currentShare.id + '/download?id=' + file.id;
      const previewLink = '/api/shares/' + state.currentShare.id + '/preview?id=' + file.id;
      document.getElementById('previewDownloadDirect').href = downloadLink;

      const body = document.getElementById('previewBody');
      body.innerHTML = '<div style="color:var(--text-secondary);">Loading preview...</div>';
      openModal('previewModal');

      const mime = file.mimeType.toLowerCase();

      if (mime.startsWith('image/')) {
        body.innerHTML = '<img src="' + previewLink + '" class="preview-media" alt="' + escapeHtml(file.displayName) + '">';
      } else if (mime.startsWith('video/')) {
        body.innerHTML = '<video src="' + previewLink + '" controls autoplay class="preview-media" style="width:100%; max-height:60vh;"></video>';
      } else if (mime.startsWith('audio/')) {
        body.innerHTML = '<audio src="' + previewLink + '" controls autoplay style="width:90%;"></audio>';
      } else if (mime === 'application/pdf') {
        body.innerHTML = '<iframe src="' + previewLink + '" style="width:100%; height:60vh; border:none; border-radius:8px;"></iframe>';
      } else if (mime.startsWith('text/') || mime.includes('json') || mime.includes('javascript')) {
        try {
          const res = await fetch(previewLink);
          const text = await res.text();
          body.innerHTML = '<pre class="code-preview"><code>' + escapeHtml(text) + '</code></pre>';
        } catch (err) {
          body.innerHTML = '<div>Cannot preview text content.</div>';
        }
      } else {
        body.innerHTML = '<div style="text-align:center; padding:30px;">' +
          '<div style="font-size:1.1rem; font-weight:600; margin-bottom:6px;">' + escapeHtml(file.displayName) + '</div>' +
          '<div style="color:var(--text-secondary); margin-bottom:16px;">Binary File • ' + formatBytes(file.sizeBytes) + '</div>' +
          '<a class="btn btn-primary" href="' + downloadLink + '" download>Download File</a>' +
        '</div>';
      }
    }

    function openModal(id) { document.getElementById(id).classList.add('open'); }
    function closeModal(id) {
      document.getElementById(id).classList.remove('open');
      if (id === 'previewModal') document.getElementById('previewBody').innerHTML = '';
    }

    let pendingShareId = null;
    function showPasswordModal(shareId) {
      pendingShareId = shareId;
      document.getElementById('passwordError').style.display = 'none';
      document.getElementById('sharePasswordInput').value = '';
      openModal('passwordModal');
    }

    async function submitPassword() {
      const pwd = document.getElementById('sharePasswordInput').value;
      if (!pwd || !pendingShareId) return;

      try {
        const res = await fetch('/api/shares/' + pendingShareId + '/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pwd })
        });

        if (res.ok) {
          const data = await res.json();
          sessionStorage.setItem('token_' + pendingShareId, data.token);
          closeModal('passwordModal');
          await openShare(pendingShareId);
        } else {
          document.getElementById('passwordError').style.display = 'block';
        }
      } catch (err) {
        document.getElementById('passwordError').innerText = 'Authentication error';
        document.getElementById('passwordError').style.display = 'block';
      }
    }

    function openUploadModal() {
      document.getElementById('uploadStatus').style.display = 'none';
      document.getElementById('fileInput').value = '';
      openModal('uploadModal');
    }

    function setupDropzone() {
      const dz = document.getElementById('dropzone');
      ['dragenter', 'dragover'].forEach(e => {
        dz.addEventListener(e, (ev) => { ev.preventDefault(); dz.classList.add('dragover'); });
      });
      ['dragleave', 'drop'].forEach(e => {
        dz.addEventListener(e, (ev) => { ev.preventDefault(); dz.classList.remove('dragover'); });
      });
      dz.addEventListener('drop', (ev) => {
        const files = ev.dataTransfer.files;
        if (files && files.length > 0) handleFileSelect(files);
      });
    }

    async function handleFileSelect(files) {
      if (!files || files.length === 0 || !state.currentShare) return;

      const statusBox = document.getElementById('uploadStatus');
      const statusText = document.getElementById('uploadStatusText');
      const percentText = document.getElementById('uploadPercent');
      const bar = document.getElementById('uploadProgressBar');
      statusBox.style.display = 'block';

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        statusText.innerText = 'Uploading ' + file.name + ' (' + (i + 1) + '/' + files.length + ')...';
        percentText.innerText = '0%';
        bar.style.width = '0%';

        await new Promise((resolve) => {
          const xhr = new XMLHttpRequest();
          xhr.open('POST', '/api/shares/' + state.currentShare.id + '/upload?filename=' + encodeURIComponent(file.name));
          const token = sessionStorage.getItem('token_' + state.currentShare.id);
          if (token) xhr.setRequestHeader('Authorization', 'Bearer ' + token);

          xhr.upload.onprogress = (ev) => {
            if (ev.lengthComputable) {
              const p = Math.round((ev.loaded / ev.total) * 100);
              percentText.innerText = p + '%';
              bar.style.width = p + '%';
            }
          };

          xhr.onload = () => { resolve(); };
          xhr.onerror = () => { resolve(); };

          xhr.send(file);
        });
      }

      statusText.innerText = 'Upload complete!';
      percentText.innerText = '100%';
      bar.style.width = '100%';

      setTimeout(() => {
        closeModal('uploadModal');
        openShare(state.currentShare.id);
      }, 800);
    }

    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function getFileTypeLabel(file) {
      const ext = file.displayName.split('.').pop().toUpperCase();
      return ext || 'FILE';
    }

    function getFileIconSvg(file, size = 48) {
      const m = file.mimeType.toLowerCase();
      let color = 'var(--accent)';
      if (m.startsWith('image/')) color = '#ec4899';
      else if (m.startsWith('video/')) color = '#8b5cf6';
      else if (m.startsWith('audio/')) color = '#10b981';
      else if (m === 'application/pdf') color = '#ef4444';
      else if (m.includes('zip') || m.includes('tar')) color = '#f59e0b';

      return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="' + color + '" stroke-width="1.6"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
    }
  </script>
</body>
</html>
