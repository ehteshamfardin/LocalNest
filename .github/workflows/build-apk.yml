name: Build Debug APK and Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          
          if [ -z "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME is not set!"
            exit 1
          fi
          
          JAVA_VERSION_OUTPUT=$(java -version 2>&1)
          JAVA_MAJOR=$(echo "$JAVA_VERSION_OUTPUT" | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{print $1}')
          
          if [ -z "$JAVA_MAJOR" ]; then
            echo "ERROR: Unable to detect Java major version from output:"
            echo "$JAVA_VERSION_OUTPUT"
            exit 1
          fi
          
          echo "Detected Java Major Version: $JAVA_MAJOR"
          
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Active Java major version ($JAVA_MAJOR) is lower than 17."
            exit 1
          fi
          
          echo "Java environment verified successfully (Java $JAVA_MAJOR >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "=== Temporary Debug Keystore Check ==="
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists. Reusing existing keystore."
          else
            echo "Generating temporary debug keystore using Java 17 keytool..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create ./debug.keystore!"
            exit 1
          fi
          
          echo "Debug keystore confirmed at ./debug.keystore."

      - name: Build debug APK
        run: |
          echo "=== Building Debug APK ==="
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          echo "=== Verifying Debug APK Output ==="
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected debug APK not found at $EXPECTED_APK"
            echo "Listing APKs in app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: APK at $EXPECTED_APK is empty (0 bytes)!"
            exit 1
          fi
          
          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "ERROR: Output file does not have .apk extension!"; exit 1 ;;
          esac
          
          APK_SIZE=$(stat -c%s "$EXPECTED_APK")
          echo "APK successfully verified:"
          echo "  Path: $EXPECTED_APK"
          echo "  Size: $APK_SIZE bytes"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          echo "=== Preparing APK Release Asset ==="
          TMP_ASSET_DIR=$(mktemp -d)
          
          REPO_RAW="${GITHUB_REPOSITORY#*/}"
          REPO_SAFE=$(echo "$REPO_RAW" | sed 's/[^a-zA-Z0-9._-]/-/g')
          if [ -z "$REPO_SAFE" ]; then
            REPO_SAFE="app"
          fi
          
          RELEASE_ASSET_NAME="${REPO_SAFE}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          RELEASE_ASSET_PATH="${TMP_ASSET_DIR}/${RELEASE_ASSET_NAME}"
          
          cp "app/build/outputs/apk/debug/app-debug.apk" "$RELEASE_ASSET_PATH"
          
          if [ ! -s "$RELEASE_ASSET_PATH" ]; then
            echo "ERROR: Release asset $RELEASE_ASSET_PATH is missing or empty!"
            exit 1
          fi
          
          echo "Prepared release asset: $RELEASE_ASSET_PATH"
          echo "Asset filename: $RELEASE_ASSET_NAME"
          echo "asset_path=$RELEASE_ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$RELEASE_ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Publishing to GitHub Releases ==="
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Prepared release asset is invalid or missing: $ASSET_PATH"
            exit 1
          fi
          
          TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          
          RELEASE_NOTES="### LocalShare Debug APK Build #${GITHUB_RUN_NUMBER}

- **Build Type:** Automatically generated debug APK
- **Workflow Run:** #${GITHUB_RUN_NUMBER} (Attempt #${GITHUB_RUN_ATTEMPT})
- **Commit SHA:** \`${GITHUB_SHA}\`
- **Notice:** This APK is an automated debug build intended for testing purposes, not a Play Store production release.
- **Signing:** Signed with a temporary development debug keystore.

Direct download is available below under Assets."
          
          echo "Creating release with tag: $TAG"
          gh release create "$TAG" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Summary & Reporting ==="
          TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "GitHub Release publishing succeeded!"
            gh release view "$TAG"
            
            REPO_URL="https://github.com/${GITHUB_REPOSITORY}"
            RELEASE_URL="${REPO_URL}/releases/tag/${TAG}"
            
            echo "Release Tag: $TAG"
            echo "Release Title: Debug APK Build #${GITHUB_RUN_NUMBER}"
            echo "Release URL: $RELEASE_URL"
            echo "Asset Filename: $ASSET_NAME"
            
            {
              echo "## 🚀 Debug APK Build & Release Summary"
              echo ""
              echo "✅ **Build Status:** Succeeded"
              echo "✅ **Artifact Status:** Normal Actions artifact \`app-debug-apk\` uploaded successfully"
              echo "✅ **Release Status:** Published to GitHub Releases"
              echo ""
              echo "- **Direct Release URL:** [$RELEASE_URL]($RELEASE_URL)"
              echo "- **Downloadable APK Asset:** \`$ASSET_NAME\`"
              echo ""
              echo "📱 **Download Instructions:** Open the release link above on your phone or computer, scroll to the **Assets** section, and tap \`$ASSET_NAME\` to download and install."
              echo ""
              echo "ℹ️ *The workflow Actions artifact \`app-debug-apk\` is also preserved as a backup.*"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release publishing failed or was skipped."
            echo "APK build succeeded. The Actions artifact named 'app-debug-apk' remains available for download."
            
            {
              echo "## ⚠️ Debug APK Build Summary"
              echo ""
              echo "✅ **Build Status:** Succeeded"
              echo "✅ **Artifact Status:** Normal Actions artifact \`app-debug-apk\` uploaded successfully"
              echo "⚠️ **Release Status:** Release publishing encountered an issue or permission restriction"
              echo ""
              echo "The compiled debug APK is safely preserved as a GitHub Actions artifact named **\`app-debug-apk\`**. You can download it directly from the Summary page of this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
